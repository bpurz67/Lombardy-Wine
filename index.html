function EARegion({ r, num, compact }) {

      borderBottom: `1px solid ${ea.rule}`,

      {/* name */}

      <div style={{
        display: 'flex', alignItems: 'center', gap: 8, marginTop: 8,
        fontFamily: ea.mono, fontSize: 9.5, letterSpacing: 1.2, textTransform: 'uppercase',

      {/* where */}
      <div style={{ display: 'flex', gap: 6, marginTop: 14, alignItems: 'flex-start' }}>
        <svg width="11" height="13" viewBox="0 0 11 13" style={{ marginTop: 1, flexShrink: 0 }}>

        </svg>
        <div style={{ fontFamily: ea.sans, fontSize: 12, color: ea.ink2, lineHeight: 1.4 }}>{r.where}</div>
      </div>

      {/* blurb */}
      <div style={{
        fontFamily: ea.serif, fontSize: compact ? 15 : 16, color: ea.ink, lineHeight: 1.4,
        marginTop: 14, paddingLeft: 10, borderLeft: `2px solid ${r.color}`,
      }}>{r.blurb}</div>

      {/* history */}
      {r.history && (
        <div style={{ marginTop: compact ? 16 : 20 }}>
          <EAKicker>History</EAKicker>
          <div style={{
            fontFamily: ea.serif, fontSize: compact ? 13.5 : 14.5, color: ea.ink2,
            lineHeight: 1.5, marginTop: 6,
          }}>{r.history}</div>
        </div>
      )}

      {/* wines table */}
      <div style={{ marginTop: compact ? 18 : 22 }}>
        <EAKicker>Styles produced in {r.name}</EAKicker>
        <div style={{ marginTop: 8 }}>
          {r.wines.map((w, i) => {
            const isSub = w.name.startsWith('·');
            const cleanName = isSub ? w.name.replace(/^·\s*/, '') : w.name;
            return (
              <div key={i} style={{
                padding: compact ? '8px 0' : '10px 0',
                borderTop: i === 0 ? 'none' : `0.5px solid ${ea.rule}`,
                paddingLeft: isSub ? 22 : 0,
                position: 'relative',
              }}>
                {isSub && (
                  <div style={{
                    position: 'absolute', left: 6, top: 0, bottom: 0,
                    borderLeft: `1px solid ${ea.rule}`,
                  }}>
                    <div style={{
                      position: 'absolute', left: 0, top: '50%',
                      width: 10, borderTop: `1px solid ${ea.rule}`,
                    }}/>
                  </div>
                )}
                {isSub && (
                  <div style={{
                    fontFamily: ea.mono, fontSize: 8, letterSpacing: 1.2,
                    textTransform: 'uppercase', color: ea.mute, marginBottom: 2,

                <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, alignItems: 'baseline' }}>
                  <div style={{
                    fontFamily: ea.serif, fontSize: isSub ? 14 : 15, color: ea.ink, fontWeight: 600,
                    letterSpacing: -0.2,
                  }}>{cleanName}</div>
                  {w.grapes && (
                    <div style={{
                      fontFamily: ea.mono, fontSize: 9, color: ea.mute, textAlign: 'right',
                      flexShrink: 0, maxWidth: '45%', lineHeight: 1.3,
                    }}>{w.grapes}</div>
                  )}
                </div>
                <div style={{ fontFamily: ea.sans, fontSize: 12, color: ea.ink2, marginTop: 3, lineHeight: 1.4 }}>
                  {w.notes}

                {w.look && (
                  <div style={{
                    fontFamily: ea.mono, fontSize: 10, color: ea.gold, marginTop: 4,
                    fontStyle: 'italic',
                  }}>↳ {w.look}</div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* good to know + producers + price */}
      <div style={{ marginTop: 18, display: 'grid', gridTemplateColumns: '1fr', gap: 12 }}>
        {r.good_to_know && (
          <div>
            <EAKicker>Good to know</EAKicker>
            <div style={{ marginTop: 6 }}>
              {r.good_to_know.map((g, i) => (
                <div key={i} style={{ display: 'grid', gridTemplateColumns: '10px 1fr', gap: 8, padding: '4px 0' }}>
                  <div style={{ color: ea.gold, fontFamily: ea.serif, fontSize: 14, lineHeight: 1.3 }}>◆</div>
                  <div style={{ fontFamily: ea.sans, fontSize: 11.5, color: ea.ink2, lineHeight: 1.45 }}>{g}</div>
                </div>
              ))}
            </div>
          </div>
        )}
        <div>
          <EAKicker>Look for</EAKicker>
          <div style={{ fontFamily: ea.serif, fontSize: 13, color: ea.ink, marginTop: 5, lineHeight: 1.45 }}>
            {r.producers.map((p, i) => (
              <span key={p}>
                <span style={{ fontStyle: 'italic' }}>{p}</span>
                {i < r.producers.length - 1 && <span style={{ color: ea.mute }}> · </span>}
              </span>
            ))}
          </div>
        </div>
        <div style={{ display: 'flex', gap: 14 }}>
          <div style={{ flex: 1 }}>
            <EAKicker>Price</EAKicker>
            <div style={{ fontFamily: ea.mono, fontSize: 12, color: ea.ink, marginTop: 5 }}>{r.price}</div>
          </div>
          <div style={{ flex: 1.4 }}>
            <EAKicker>Pair with</EAKicker>
            <div style={{ fontFamily: ea.sans, fontSize: 11, color: ea.ink2, marginTop: 5, lineHeight: 1.4 }}>
              {r.pair.join(' · ')}
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

                    borderLeft: `1px dashed ${vl.wine}66`,

            <div key={i} style={{
              textAlign: 'center', padding: '5px 0',

        <VLLabel>Produttori di fiducia</VLLabel>
        <div style={{
          fontFamily: vl.body, fontSize: 13, color: vl.ink, marginTop: 6,
          lineHeight: 1.5, fontStyle: 'italic',
        }}>
          {r.producers.join(' · ')}

      </div>

      <div style={{
        marginTop: 16, padding: '12px 0',
        borderTop: `1px solid ${vl.rule}`,
        display: 'grid', gridTemplateColumns: '1fr 1.6fr', gap: 14,

// ─────────────────────────────────────────────
// APP
// ─────────────────────────────────────────────

function App() {
  const [styleDir, setStyleDir] = React.useState(() => {
    try { return localStorage.getItem('lw-style') || 'editorial'; } catch { return 'editorial'; }
  });

  const toggle = () => {
    const next = styleDir === 'editorial' ? 'vintage' : 'editorial';
    setStyleDir(next);
    try { localStorage.setItem('lw-style', next); } catch {}
    window.scrollTo({ top: 0, behavior: 'smooth' });
    document.getElementById('theme-color-meta').setAttribute('content',
      next === 'editorial' ? '#F5EFE4' : '#EFE5D0'
    );
  };

  const isEditorial = styleDir === 'editorial';

  return (
    <div style={{ minHeight: '100vh', maxWidth: 480, margin: '0 auto' }}>
      {isEditorial ? <EditorialAlmanac /> : <VintageLabel />}

      <button
        onClick={toggle}
        className="style-fab"
        aria-label={`Switch to ${isEditorial ? 'Vintage' : 'Editorial'} style`}
        style={{
          background: isEditorial ? '#6B1F2A' : '#5A1520',
          color: '#FBF7EC',
        }}
      >
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M2 7h10M7 2l5 5-5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
        {isEditorial ? 'Vintage' : 'Editorial'}
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
